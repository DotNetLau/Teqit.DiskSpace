name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test --configuration Release

      - name: Publish single-file executables
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for rid in win-x64 win-arm64 linux-x64 linux-arm64; do
            dotnet publish src/Teqit.DiskSpace -c Release -r "$rid" --self-contained \
              -p:PublishSingleFile=true -p:Version="$version" -o "publish/$rid"
            if [[ "$rid" == win-* ]]; then
              cp "publish/$rid/diskspace.exe" "dist/diskspace-$rid.exe"
            else
              cp "publish/$rid/diskspace" "dist/diskspace-$rid"
            fi
          done
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --generate-notes
